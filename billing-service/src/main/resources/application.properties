# ==========================================
# APPLICATION & SERVER CONFIGURATION
# ==========================================
spring.application.name=BillingContext
server.port=8081

# Domain Config
clinic.checkout.payment-timeout=20s

# ==========================================
# DATABASE & JPA CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clinic_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clinic_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==========================================
# RABBITMQ CONNECTION & EXCHANGES
# ==========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.messaging.exchanges.appointment=appointment.exchange

# ==========================================
# RABBITMQ ROUTING KEYS
# ==========================================
app.messaging.routing-keys.appointment-booked=appointment.booked.key
app.messaging.routing-keys.appointment-canceled=appointment.canceled.key
app.messaging.routing-keys.appointment-expired=appointment.expired.key

# ==========================================
# RABBITMQ QUEUES
# ==========================================
app.messaging.queues.appointment-booked=appointment.booked.queue
app.messaging.queues.appointment-canceled=appointment.canceled.queue
app.messaging.queues.appointment-expired=appointment.expired.queue

# ==========================================
# STRIPE CONFIGURATION
# ==========================================
stripe.api.key=${STRIPE_API_KEY}
stripe.payment.endPoint.key=${STRIPE_PAYMENT_ENDPOINT_KEY}